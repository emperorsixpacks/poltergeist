<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Poltergeist — Options</title>
    <style>
      :root {
        --pg-bg: #120a20;
        --pg-border: rgba(168, 85, 247, 0.55);
        --pg-purple: #a855f7;
        --pg-orange: #ff8a1f;
        --pg-ghost: #f3eaff;
        --pg-text: #f5efff;
        --pg-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 40px;
        background: var(--pg-bg);
        color: var(--pg-text);
        font-family: var(--pg-font);
        max-width: 540px;
      }
      .header-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 20px;
      }
      .header-ghost {
        width: 48px;
        height: 58px;
        filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.6));
      }
      .header-ghost svg {
        width: 100%;
        height: 100%;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
        color: var(--pg-ghost);
      }
      .tag {
        color: var(--pg-orange);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        font-weight: 600;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--pg-ghost);
        margin: 20px 0 6px;
      }
      input {
        width: 100%;
        padding: 11px 14px;
        border-radius: 14px;
        border: 1px solid var(--pg-border);
        background: rgba(28, 16, 48, 0.7);
        color: var(--pg-text);
        font-family: var(--pg-font);
        font-size: 14px;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      input:focus {
        outline: none;
        border-color: var(--pg-purple);
        box-shadow: 0 0 14px rgba(168, 85, 247, 0.4);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .row input {
        flex: 1;
      }
      .row button {
        flex-shrink: 0;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid var(--pg-border);
        background: rgba(28, 16, 48, 0.7);
        color: var(--pg-text);
        font-family: var(--pg-font);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 14px rgba(168, 85, 247, 0.5);
      }
      button.primary {
        background: linear-gradient(135deg, #a855f7, #ff8a1f);
        border: none;
        color: #1a0f2e;
        margin-top: 26px;
        font-size: 14px;
        padding: 12px 24px;
      }
      button.primary:hover {
        box-shadow: 0 0 18px rgba(255, 138, 31, 0.6);
      }
      .hint {
        font-size: 12px;
        color: #a49bc2;
        margin-top: 5px;
      }
      .hint code {
        background: rgba(255, 255, 255, 0.1);
        padding: 2px 6px;
        border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: var(--pg-ghost);
      }
      #status {
        font-size: 13px;
        margin-top: 18px;
        min-height: 18px;
        line-height: 1.4;
      }
      #status.ok {
        color: #7cf29b;
      }
      #status.err {
        color: var(--pg-orange);
      }
    </style>
  </head>
  <body>
    <div class="header-row">
      <div id="header-avatar" class="header-ghost"></div>
      <div>
        <h1>Poltergeist — Options</h1>
        <div class="tag">Configure your ghost</div>
      </div>
    </div>

    <label for="gkey">Groq API key</label>
    <input id="gkey" type="password" placeholder="gsk_..." />
    <div class="hint">
      Free tier: <code>console.groq.com/keys</code>. Runs the open-weight model below.
    </div>

    <label for="model">Groq model</label>
    <input id="model" type="text" placeholder="openai/gpt-oss-120b" />
    <div class="hint">
      Available on your key: <code>openai/gpt-oss-120b</code>,
      <code>openai/gpt-oss-20b</code>, <code>qwen/qwen3.8-27b</code>.
    </div>

    <label for="key">ElevenLabs API key</label>
    <input id="key" type="password" placeholder="sk_..." />

    <label for="voice">ElevenLabs voice ID</label>
    <div class="row">
      <input id="voice" type="text" placeholder="Voice ID (e.g. 21m00Tcm4TlvDq8ikWAM)" />
      <button id="test">Test voice</button>
    </div>

    <button id="save" class="primary">Save</button>
    <div id="status"></div>

    <script src="assets.js"></script>
    <script src="options.js"></script>
  </body>
</html>
